name: Pre-build flake update

# Both jobs below are REQUIRED status checks on main (ruleset "Protect Main").
#
# That is why the pull_request trigger carries no `paths:` filter, even though
# only flake.lock and *.nix can change a closure. A required check that never
# reports leaves the PR permanently "expected — waiting for status", so the
# filter would block every docs-only PR forever rather than passing it. When
# nothing relevant changed the run is a cache lookup: measured 58s (aarch64)
# and 18s (x86_64) on PR #518.
#
# The push trigger keeps its filter — that path only exists to warm attic after
# a merge, and nothing gates on it.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - flake.lock
      - "**/*.nix"

# Cancel any in-progress pre-build for the same PR when a new commit arrives.
concurrency:
  group: pre-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-aarch64:
    name: Build aarch64 closures (rivendell)
    runs-on: [self-hosted, Linux, ARM64, nix-builder]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      # Evaluate first, one host per process, then build the .drv paths.
      #
      # This job's nix client and nix-daemon's builds share ONE 4 GiB budget
      # (build.slice, hosts/rivendell.nix). `nix build <three flake attrs>`
      # evaluates all three toplevels in a single process and keeps that
      # memory (2.2 GB anon) for the whole build, leaving the actual builds
      # under 2 GiB. Lock PR #964 was OOM-killed in build.slice that way on
      # 2026-11-07, mid homepage-dashboard build.
      #
      # Split up, each eval peaks at ~1.1 GB and returns it on exit before
      # anything builds. Building from `.drv^*` evaluates nothing (~40 MB
      # client), so the daemon gets nearly the whole budget. Keep the evals
      # sequential: running them in parallel would bring the combined peak back.
      - name: Build Pi closures
        run: |
          set -euo pipefail
          drvs=()
          for host in rivendell mirkwood pirateship; do
            drvs+=("$(nix eval --raw ".#nixosConfigurations.$host.config.system.build.toplevel.drvPath")^*")
          done
          nix build --no-link "${drvs[@]}"

  build-x86_64:
    name: Build x86_64 closure (orthanc)
    runs-on: [self-hosted, Linux, X64, nix-builder]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build orthanc closure
        run: |
          nix build --no-link \
            .#nixosConfigurations.orthanc.config.system.build.toplevel
